name: Documentation

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Confirm documentation deployment to GitHub Pages"
        required: true
        type: boolean

env:
  SHOULD_DEPLOY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.confirm_deployment) }}

jobs:
  build_docs:
    name: "Build documentation + Documentation Coverage Check"
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ env.SHOULD_DEPLOY }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install volsegtools and documentation dependencies
        run: uv sync --group docs
      - name: Build HTML of documentation
        run: >
          uv run --no-sync sphinx-build -n -W --keep-going -b html \
            --doctree-dir docs/_build/doctrees \
            docs docs/_build/html
      - name: Build Sphinx documentation coverage report
        run: >
          uv run --no-sync sphinx-build -q -n -W --keep-going -b coverage \
            --doctree-dir docs/_build/doctrees \
            docs docs/_build/coverage
      - name: Publish coverage report
        run: |
          {
            echo "## Documentation Coverage"
            echo "---"
            cat docs/_build/coverage/python.txt
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare Pages uploadable artifact
        if: env.SHOULD_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/_build/html

  deploy_pages:
    name: "Deploy documentation to GitHub pages."
    if: needs.build_docs.outputs.deploy == 'true'
    needs: build_docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          {
            echo "## Documentation deployment"
            echo "- **URL**: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
